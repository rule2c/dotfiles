# ============================================================
# mihomo 完整配置模板（OpenClash / Clash Verge 共用）
# 节点来自 Sub-Store；分流规则由原 subconverter-config.ini 转写
# 唯一需要改的地方：下面 proxy-providers 里的 url
# ============================================================

mixed-port: 7890
allow-lan: true
mode: rule
log-level: warning
ipv6: true
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
geodata-mode: true
geo-auto-update: true
geo-update-interval: 72
geox-url:
  geoip: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat"
  geosite: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
  mmdb: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country.mmdb"

profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: 2001:2::1/64   # 不用 fdfe 段：会被 Chrome 的本地网络访问保护拦截
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "+.example.com"          # 自己的节点域名，返回真实 IP
    - "geosite:private"
    - "geosite:connectivity-check"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.*.com"
    - "ntp.*.com"
    - "+.stun.*.*"
    - "+.stun.*.*.*"
    - "+.steamserver.net"
    - "+.oraclecloud.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

sniffer:
  enable: true
  sniff:
    HTTP: {ports: [80, 8080-8880], override-destination: true}
    TLS: {ports: [443, 8443]}
    QUIC: {ports: [443, 8443]}

# ---------------- 节点：来自 Sub-Store ----------------
proxy-providers:
  substore:
    type: http
    # ↓↓↓ 换成你的 Sub-Store 组合订阅链接（target=mihomo）
    url: "https://sub.example.com:8443/BACKEND_PATH/download/collection/all?target=mihomo"
    path: ./providers/substore.yaml
    interval: 3600
    proxy: DIRECT
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 600

# ---------------- 策略组 ----------------
# 回落组都设了 empty-fallback: REJECT：节点名没匹配上时直接断开，不会悄悄变成直连
# 回落顺序 = 节点在 Sub-Store 里的排列顺序
#   东京：xhttp → vision
#   洛杉矶：reality → hysteria2 → cdn-ws
# 单个节点只出现在各自的回落组里；其他组只引用回落组，避免重复
# 美国走哪台只在 🇺🇸 美国节点 里选，🚀 手动选择 只在 美国 / 日本 之间选，关联服务始终同一出口
proxy-groups:
  - name: 🚀 手动选择
    type: select
    proxies: [🇺🇸 美国节点, 🇯🇵 日本节点]

  - name: 🎯 全球直连
    type: select
    proxies: [DIRECT]

  # 洛杉矶 vmiss：3 条线路按顺序回落（同一出口 IP）
  - name: 🇺🇸 vmiss回落
    type: fallback
    use: [substore]
    filter: "(?i)vmiss-"
    empty-fallback: REJECT
    url: https://www.gstatic.com/generate_204
    interval: 180

  # 东京 Oracle：XHTTP 优先，不通切 Vision
  - name: 🇯🇵 Oracle回落
    type: fallback
    use: [substore]
    filter: "(?i)oracle_arm-(xhttp|vision)"
    empty-fallback: REJECT
    url: https://www.gstatic.com/generate_204
    interval: 180

  # 洛杉矶 nosla：3 条线路按顺序回落（同一出口 IP）
  - name: 🇺🇸 nosla回落
    type: fallback
    use: [substore]
    filter: "(?i)nosla-"
    empty-fallback: REJECT
    url: https://www.gstatic.com/generate_204
    interval: 180

  - name: 🇺🇸 美国节点
    type: select
    proxies: [🇺🇸 vmiss回落, 🇺🇸 nosla回落]

  - name: 🇯🇵 日本节点
    type: select
    proxies: [🇯🇵 Oracle回落]

  # 出口一致：AI、美区锁定、Google 全家（含 YouTube、FCM）只引用 🇺🇸 美国节点，
  # 在 🇺🇸 美国节点 里切 vmiss / nosla，这些组一起跟着切，不会被拆到两台机器
  - name: 🤖 AI服务
    type: select
    proxies: [🇺🇸 美国节点]

  - name: 📍 美区锁定
    type: select
    proxies: [🇺🇸 美国节点]

  - name: 🔴 Oracle服务
    type: select
    proxies: [DIRECT, 🇯🇵 日本节点, 🇺🇸 美国节点]

  - name: 🎥 流媒体
    type: select
    proxies: [🇺🇸 美国节点, 🇺🇸 vmiss回落, 🇺🇸 nosla回落, 🇯🇵 日本节点]

  - name: 🎶 TikTok
    type: select
    proxies: [🇺🇸 美国节点, 🇺🇸 vmiss回落, 🇺🇸 nosla回落, 🇯🇵 日本节点]

  # 广告拦截：误杀时切到 DIRECT 即可临时关掉，不用改配置
  - {name: 🛑 广告拦截, type: select, proxies: [REJECT, DIRECT]}
  - {name: 💬 即时通讯, type: select, proxies: [🚀 手动选择]}
  - {name: 🌐 社交媒体, type: select, proxies: [🚀 手动选择]}
  - {name: 🚀 GitHub,   type: select, proxies: [🚀 手动选择]}
  - {name: 📢 谷歌FCM,  type: select, proxies: [🇬 谷歌服务]}
  - {name: 🇬 谷歌服务,  type: select, proxies: [🇺🇸 美国节点]}
  - {name: 🍎 苹果服务,  type: select, proxies: [🎯 全球直连, 🚀 手动选择]}
  - {name: Ⓜ️ 微软服务, type: select, proxies: [🎯 全球直连, 🚀 手动选择]}
  - {name: 🎮 游戏平台,  type: select, proxies: [🎯 全球直连, 🚀 手动选择]}
  - {name: 🎮 Steam,    type: select, proxies: [🎯 全球直连, 🚀 手动选择]}
  - {name: 🚀 测速工具,  type: select, proxies: [🎯 全球直连, 🚀 手动选择]}
  - {name: 🐟 漏网之鱼,  type: select, proxies: [🚀 手动选择, 🎯 全球直连]}
  - {name: 🔀 非标端口,  type: select, proxies: [🐟 漏网之鱼, 🎯 全球直连]}

# ---------------- 你自己仓库里的规则列表 ----------------
# 通过代理下载，国内拉 raw.githubusercontent.com 不会卡住；用手动选择组，东京挂了也能换节点更新
rule-anchor:
  classical: &classical {type: http, behavior: classical, format: text, interval: 86400, proxy: 🚀 手动选择}

rule-providers:
  Apple-AI:      {<<: *classical, url: "https://raw.githubusercontent.com/rule2c/dotfiles/refs/heads/main/rule/Apple-AI.list",                path: ./rules/Apple-AI.list}
  Custom_Direct: {<<: *classical, url: "https://raw.githubusercontent.com/rule2c/dotfiles/refs/heads/main/rule/Custom_Direct_Classical.list", path: ./rules/Custom_Direct.list}
  Custom_Proxy:  {<<: *classical, url: "https://raw.githubusercontent.com/rule2c/dotfiles/refs/heads/main/rule/Custom_Proxy_Classical.list",  path: ./rules/Custom_Proxy.list}
  Steam_CDN:     {<<: *classical, url: "https://raw.githubusercontent.com/rule2c/dotfiles/refs/heads/main/rule/Steam_CDN.list",               path: ./rules/Steam_CDN.list}
  Custom_Port:   {<<: *classical, url: "https://raw.githubusercontent.com/rule2c/dotfiles/refs/heads/main/rule/Custom_Port_Direct.list",      path: ./rules/Custom_Port.list}
  HGhub:         {<<: *classical, url: "https://raw.githubusercontent.com/rule2c/dotfiles/refs/heads/main/rule/HGhub.list",                  path: ./rules/HGhub.list}

# ---------------- 分流规则（从上往下匹配） ----------------
rules:
  # Tailscale 自己的连接直连，避免打洞流量被代理（路由器和 Windows 进程名不同）
  - PROCESS-NAME,tailscaled,🎯 全球直连
  - PROCESS-NAME,tailscaled.exe,🎯 全球直连
  - DOMAIN-SUFFIX,tailscale.com,🎯 全球直连
  - DOMAIN-SUFFIX,tailscale.io,🎯 全球直连
  - IP-CIDR,100.64.0.0/10,🎯 全球直连,no-resolve
  - AND,((NETWORK,UDP),(DST-PORT,41641)),🎯 全球直连
  # 本地地址直连
  - GEOSITE,private,🎯 全球直连
  - GEOIP,private,🎯 全球直连,no-resolve

  # 广告拦截：要放在 Google / AI 规则前面（geosite:google 本身含 Google 广告域名）
  # 白名单：被误杀的域名写在这条 GEOSITE 前面，例如
  # - DOMAIN-SUFFIX,example.com,🎯 全球直连
  - GEOSITE,category-ads-all,🛑 广告拦截

  # 海外 QUIC 拒绝，让浏览器回落到 TCP（与 OpenClash 的 QUIC REJECT 一致）
  - AND,((NETWORK,UDP),(DST-PORT,443),(NOT,((GEOSITE,cn)))),REJECT

  # 美区锁定
  - RULE-SET,Apple-AI,📍 美区锁定
  - DOMAIN-SUFFIX,3gppnetwork.org,📍 美区锁定
  - DOMAIN-SUFFIX,t-mobile.com,📍 美区锁定
  - DOMAIN-SUFFIX,tmobile.com,📍 美区锁定
  - DOMAIN-SUFFIX,t-mobilemoney.com,📍 美区锁定
  - DOMAIN-SUFFIX,t-mo.co,📍 美区锁定
  - DOMAIN-SUFFIX,sprint.com,📍 美区锁定
  - DOMAIN-SUFFIX,voice.google.com,📍 美区锁定
  - GEOSITE,paypal,📍 美区锁定
  - DOMAIN-SUFFIX,theriansaga.com,📍 美区锁定

  # AI（Cloudflare 人机验证跟 AI 走同一出口）
  - GEOSITE,bing,🤖 AI服务
  - GEOSITE,anthropic,🤖 AI服务
  - GEOSITE,openai,🤖 AI服务
  - GEOSITE,category-ai-!cn,🤖 AI服务
  - DOMAIN,challenges.cloudflare.com,🤖 AI服务

  # 谷歌：子集放在大类前面
  - GEOSITE,googlefcm,📢 谷歌FCM
  - GEOSITE,youtube,🇬 谷歌服务   # YouTube 和 Google 账号同一出口
  - GEOSITE,google,🇬 谷歌服务
  - GEOIP,google,🇬 谷歌服务,no-resolve

  # 流媒体 / TikTok：彼此独立的服务，可以单独选别的出口
  - GEOSITE,netflix,🎥 流媒体
  - GEOSITE,disney,🎥 流媒体
  - GEOSITE,hbo,🎥 流媒体
  - GEOSITE,primevideo,🎥 流媒体
  - GEOSITE,tiktok,🎶 TikTok

  # 自定义直连 / 代理
  - RULE-SET,Custom_Direct,🎯 全球直连,no-resolve
  - RULE-SET,Custom_Proxy,🚀 手动选择,no-resolve

  # 国内服务直连
  - GEOSITE,category-games@cn,🎯 全球直连
  - RULE-SET,Steam_CDN,🎯 全球直连,no-resolve
  - GEOSITE,category-game-platforms-download,🎯 全球直连
  - GEOSITE,category-public-tracker,🎯 全球直连

  # 常规分流
  - GEOSITE,oracle,🔴 Oracle服务
  - GEOSITE,category-communication,💬 即时通讯
  - GEOSITE,category-social-media-!cn,🌐 社交媒体
  - GEOSITE,github,🚀 GitHub
  # HGhub：放在 GitHub 之后，让 github.com 继续走 🚀 GitHub 组；要在 GEOSITE,cn 之前，否则 .cn 的 CDN 会被直连
  - RULE-SET,HGhub,🚀 手动选择
  - GEOSITE,microsoft,Ⓜ️ 微软服务
  - GEOSITE,apple,🍎 苹果服务
  - GEOSITE,steam,🎮 Steam
  - GEOSITE,category-games,🎮 游戏平台
  - GEOIP,telegram,💬 即时通讯,no-resolve
  - GEOIP,twitter,🌐 社交媒体,no-resolve
  - GEOIP,facebook,🌐 社交媒体,no-resolve
  - GEOSITE,category-speedtest,🚀 测速工具

  # GFW / 国内 / 兜底
  - GEOSITE,gfw,🚀 手动选择
  - GEOSITE,cn,🎯 全球直连
  - GEOIP,cn,🎯 全球直连,no-resolve
  - RULE-SET,Custom_Port,🔀 非标端口
  - MATCH,🐟 漏网之鱼