# ---------------- 分流规则（从上往下匹配） ----------------
rules:
  # Tailscale 直连，避免打洞流量被代理（路由器上的 tailscaled 已由 nikki 按 cgroup 绕过，不用 PROCESS-NAME）
  - DOMAIN-SUFFIX,tailscale.com,🎯 全球直连
  - DOMAIN-SUFFIX,tailscale.io,🎯 全球直连
  - IP-CIDR,100.64.0.0/10,🎯 全球直连,no-resolve
  - AND,((NETWORK,UDP),(DST-PORT,41641)),🎯 全球直连
  # 局域网设备上的 Tailscale：网关上用不了 PROCESS-NAME，改按端口识别
  # Windows / Linux 客户端默认从 41641 发出 STUN 和 WireGuard 流量
  - AND,((NETWORK,UDP),(SRC-PORT,41641)),🎯 全球直连
  # STUN 直连，NAT 探测拿到的是本地真实出口，打洞才可能成功
  - AND,((NETWORK,UDP),(DST-PORT,3478)),🎯 全球直连
  # 本地地址直连
  - RULE-SET,geosite-private,🎯 全球直连
  - RULE-SET,geoip-private,🎯 全球直连,no-resolve

  # 广告拦截：要放在 Google / AI 规则前面（geosite:google 本身含 Google 广告域名）
  # 白名单：被误杀的域名写在这条规则前面，例如
  # - DOMAIN-SUFFIX,example.com,🎯 全球直连
  - RULE-SET,geosite-category-ads-all,🛑 广告拦截
  # ↓ 补回 MRS 丢掉的 regexp（category-ads-all ← ookla-speedtest@ads）。规则里不能有逗号，{2,6} 已展开
  - DOMAIN-REGEX,^speed\.(coe|open)\.ad\.[a-z]{2}[a-z]?[a-z]?[a-z]?[a-z]?\.prod\.hosts\.ooklaserver\.net$,🛑 广告拦截

  # 海外 QUIC 拒绝，让浏览器回落到 TCP（与 OpenClash 的 QUIC REJECT 一致）
  - AND,((NETWORK,UDP),(DST-PORT,443),(NOT,((RULE-SET,geosite-cn)))),REJECT

  # 美区锁定
  - RULE-SET,Apple-AI,📍 美区锁定
  - DOMAIN-SUFFIX,3gppnetwork.org,📍 美区锁定
  - DOMAIN-SUFFIX,t-mobile.com,📍 美区锁定
  - DOMAIN-SUFFIX,tmobile.com,📍 美区锁定
  - DOMAIN-SUFFIX,t-mobilemoney.com,📍 美区锁定
  - DOMAIN-SUFFIX,t-mo.co,📍 美区锁定
  - DOMAIN-SUFFIX,sprint.com,📍 美区锁定
  - RULE-SET,geosite-paypal,📍 美区锁定
  - DOMAIN-SUFFIX,theriansaga.com,📍 美区锁定

  # Gemini 跟 Google 账号走：要放在 category-ai-!cn 前面，否则会被 AI 规则先匹配
  # google-deepmind 含 Gemini、AI Studio、NotebookLM、Gemini API 等（google-gemini 只是它的旧别名）
  - RULE-SET,geosite-google-deepmind,🇬 谷歌服务

  # AI（Cloudflare 人机验证跟 AI 走同一出口）
  # Bing 积分走直连：要放在 geosite-bing 前面，否则会被 AI 规则先匹配
  - DOMAIN-SUFFIX,rewards.bing.com,🎯 全球直连
  - RULE-SET,geosite-bing,🤖 AI服务
  - RULE-SET,geosite-anthropic,🤖 AI服务
  - RULE-SET,geosite-openai,🤖 AI服务
  # ↓ 补回 regexp（openai）：ChatGPT 推送通道在 azure.com 下，漏掉会被 geosite-microsoft 送去直连
  - DOMAIN-REGEX,^chatgpt-async-webps-prod-\S+-\d+\.webpubsub\.azure\.com$,🤖 AI服务
  - RULE-SET,geosite-category-ai-!cn,🤖 AI服务
