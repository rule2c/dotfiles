# ============================================================
# mihomo 配置 —— ImmortalWrt 主路由 nikki 专用
# 由 mihomo 文件（OpenClash / Clash Verge 共用模板）派生；
# 策略组 / 分流规则改动时请同步两边
# 与共用模板的区别：
#   - find-process-mode: off，删掉 PROCESS-NAME 规则（网关上匹配不到局域网设备的进程；
#     路由器自己的 tailscaled 已由 nikki 按 cgroup 绕过），
#     改用 UDP 源端口 41641 / 目标端口 3478 让局域网 Tailscale 直连
#   - TCP Keep Alive 600/15（nikki FAQ：降低 iPhone 等设备在透明代理下的耗电）
#   - fake-ip-filter 加 Apple 推送、home.arpa
#   - 嗅探器写全（QUIC 只嗅探 443）
#   - 不用 GeoX 数据库：GEOSITE / GEOIP 全部换成 MetaCubeX meta-rules-dat 的 MRS 规则集
#     （同一份数据源）。MRS 只存域名 / 后缀，geosite 里的 regexp 条目会丢，
#     影响分流的几条已在对应位置用 DOMAIN-REGEX 补回；单标签主机名改由 fake-ip-filter 的 "*" 放行
# 端口 / 监听 / 面板 / TUN / DNS 监听等由 nikki LuCI 混入，这里的同名项会被覆盖
# ============================================================

mixed-port: 7890
allow-lan: true
mode: rule
log-level: warning
ipv6: true
unified-delay: true
tcp-concurrent: true
find-process-mode: off
keep-alive-idle: 600
keep-alive-interval: 15
# 规则里已没有 GEOSITE / GEOIP，不再下载 GeoX 数据库
geo-auto-update: false

profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: 2001:2::1/64   # 不用 fdfe 段：会被 Chrome 的本地网络访问保护拦截
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "+.home.arpa"
    - "*"                                   # 单标签主机名（原 geosite:private 里的 regexp，MRS 不含）
    - "rule-set:geosite-private"
    - "rule-set:geosite-connectivity-check"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.*.com"
    - "ntp.*.com"
    - "+.stun.*.*"
    - "+.stun.*.*.*"
    - "+.steamserver.net"
    - "+.oraclecloud.com"
    # Apple 推送返回真实 IP：nikki 停止 / 重启期间 iPhone 推送长连接不受影响
    - "+.push.apple.com"
    # Tailscale MagicDNS 返回真实 100.x 地址，流量才会走 tailscale0 而不是进核心
    # （解析由 nikki UCI 的 nameserver-policy 交给 100.100.100.100）
    - "+.ts.net"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

sniffer:
  enable: true
  override-destination: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP: {ports: [80, 8080-8880], override-destination: true}
    TLS: {ports: [443, 8443]}
    QUIC: {ports: [443]}
  force-domain:
    - +.netflix.com
    - +.nflxvideo.net
    - +.amazonaws.com
    - +.media.dssott.com
  skip-domain:
    - Mijia Cloud
    - dlg.io.mi.com
    - +.oray.com
    - +.sunlogin.net
    - +.push.apple.com

# ---------------- 节点：来自 Sub-Store ----------------
proxy-providers:
  substore:
    type: http
    # ↓↓↓ 换成你的 Sub-Store 组合订阅链接（target=mihomo）
    url: "https://sub.example.com:8443/BACKEND_PATH/download/collection/all?target=mihomo"
    path: ./providers/substore.yaml
    interval: 3600
    proxy: DIRECT
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 600

# ---------------- 策略组 ----------------
# 回落组都设了 empty-fallback: REJECT：节点名没匹配上时直接断开，不会悄悄变成直连
# 回落顺序 = 节点在 Sub-Store 里的排列顺序
#   东京：reality → hysteria2 → cdn-ws
#   洛杉矶：同上
# 单个节点只出现在各自的回落组里；其他组只引用回落组，避免重复
# 美国走哪台只在 🇺🇸 美国节点 里选，🚀 手动选择、🇬 谷歌服务 只在 美国 / 日本 之间选，关联服务始终同一出口
proxy-groups:
  - name: 🚀 手动选择
    type: select
    proxies: [🇺🇸 美国节点, 🇯🇵 日本节点]

  - name: 🎯 全球直连
    type: select
    proxies: [DIRECT]

  # 洛杉矶 vmiss：3 条线路按顺序回落（同一出口 IP）
  - name: 🇺🇸 vmiss回落
    type: fallback
    use: [substore]
    filter: "(?i)vmiss-"
    empty-fallback: REJECT
    url: https://www.gstatic.com/generate_204
    interval: 180

  # 东京 Oracle：3 条线路按顺序回落（同一出口 IP）
  - name: 🇯🇵 Oracle回落
    type: fallback
    use: [substore]
    filter: "(?i)oracle-"
    empty-fallback: REJECT
    url: https://www.gstatic.com/generate_204
    interval: 180

  # 洛杉矶 nosla：3 条线路按顺序回落（同一出口 IP）
  - name: 🇺🇸 nosla回落
    type: fallback
    use: [substore]
    filter: "(?i)nosla-"
    empty-fallback: REJECT
    url: https://www.gstatic.com/generate_204
    interval: 180

  - name: 🇺🇸 美国节点
    type: select
    proxies: [🇺🇸 vmiss回落, 🇺🇸 nosla回落]

  - name: 🇯🇵 日本节点
    type: select
    proxies: [🇯🇵 Oracle回落]

  # Google 全家（含 YouTube、FCM、Gemini）单独一个开关，在这里选 美国 / 日本；
  # Gemini 跟 Google 账号同一出口
  - name: 🇬 谷歌服务
    type: select
    proxies: [🇺🇸 美国节点, 🇯🇵 日本节点]

  # AI（ChatGPT、Claude 等）只引用 🇺🇸 美国节点；
  # 在 🇺🇸 美国节点 里切 vmiss / nosla，AI 和美区锁定一起跟着切，不会被拆到两台机器
  - name: 🤖 AI服务
    type: select
    proxies: [🇺🇸 美国节点]

  # 美区锁定始终走美国：Apple AI、T-Mobile、PayPal 等要求美国 IP
  # Google Voice 不在这里：它跟着 🇬 谷歌服务 走，换号等操作时把谷歌服务临时切回美国
  - name: 📍 美区锁定
    type: select
    proxies: [🇺🇸 美国节点]

  - name: 🔴 Oracle服务
    type: select
    proxies: [DIRECT, 🇯🇵 日本节点, 🇺🇸 美国节点]

  - name: 🎥 流媒体
    type: select
    proxies: [🇺🇸 美国节点, 🇺🇸 vmiss回落, 🇺🇸 nosla回落, 🇯🇵 日本节点]

  - name: 🎶 TikTok
    type: select
    proxies: [🇺🇸 美国节点, 🇺🇸 vmiss回落, 🇺🇸 nosla回落, 🇯🇵 日本节点]

  # 广告拦截：误杀时切到 DIRECT 即可临时关掉，不用改配置
  - {name: 🛑 广告拦截, type: select, proxies: [REJECT, DIRECT]}
  - {name: 💬 即时通讯, type: select, proxies: [🚀 手动选择]}
  - {name: 🌐 社交媒体, type: select, proxies: [🚀 手动选择]}
  - {name: 🚀 GitHub,   type: select, proxies: [🚀 手动选择]}
  - {name: 📢 谷歌FCM,  type: select, proxies: [🇬 谷歌服务]}
  - {name: 🍎 苹果服务,  type: select, proxies: [🎯 全球直连, 🚀 手动选择]}
  - {name: Ⓜ️ 微软服务, type: select, proxies: [🎯 全球直连, 🚀 手动选择]}
  - {name: 🎮 游戏平台,  type: select, proxies: [🎯 全球直连, 🚀 手动选择]}
  - {name: 🎮 Steam,    type: select, proxies: [🎯 全球直连, 🚀 手动选择]}
  - {name: 🚀 测速工具,  type: select, proxies: [🎯 全球直连, 🚀 手动选择]}
  - {name: 🐟 漏网之鱼,  type: select, proxies: [🚀 手动选择, 🎯 全球直连]}
  - {name: 🔀 非标端口,  type: select, proxies: [🐟 漏网之鱼, 🎯 全球直连]}

